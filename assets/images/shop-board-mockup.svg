<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wallDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="acpSheet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="50%" stop-color="#1C2D4A"/>
      <stop offset="100%" stop-color="#0A1128"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="boardDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="12" fill="url(#wallDark)"/>

  <!-- Shop Front Facade Building Architecture -->
  <rect x="0" y="460" width="800" height="60" fill="#0B0F19"/>
  <line x1="0" y1="460" x2="800" y2="460" stroke="#374151" stroke-width="2"/>

  <!-- Glass Showroom Windows Below -->
  <rect x="80" y="340" width="640" height="120" rx="4" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <rect x="90" y="350" width="190" height="100" fill="#0F172A"/>
  <rect x="305" y="350" width="190" height="100" fill="#0F172A"/>
  <rect x="520" y="350" width="190" height="100" fill="#0F172A"/>
  <text x="400" y="410" fill="#64748B" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" text-anchor="middle">SHOWROOM MAIN ENTRANCE</text>

  <!-- ACP Cladding Glow Signboard -->
  <g filter="url(#boardDrop)">
    <rect x="60" y="80" width="680" height="230" rx="8" fill="url(#acpSheet)" stroke="#3B82F6" stroke-width="2"/>
    <rect x="68" y="88" width="664" height="214" rx="4" fill="none" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Subtle Golden Jaali Lattice Accent -->
    <g opacity="0.07" stroke="#FBBF24" stroke-width="1">
      <path d="M70 195 L200 80 L330 195 L200 310 Z" fill="none"/>
      <path d="M470 195 L600 80 L730 195 L600 310 Z" fill="none"/>
    </g>

    <!-- Hindi Trust Heading -->
    <text x="400" y="130" fill="#FDE047" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="4">
      ॥ श्री गणेशाय नमः ॥ 916 हॉलमार्क ज्वेलरी
    </text>

    <!-- 3D LED Acrylic Letters (Glowing) -->
    <g filter="url(#neonGlow)">
      <text x="400" y="195" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="3" stroke="#F59E0B" stroke-width="1.5">
        MAHAVEER JEWELLERS
      </text>

      <text x="400" y="235" fill="#FBBF24" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="4">
        GOLD • DIAMOND • SILVER ORNAMENTS
      </text>
    </g>

    <!-- Address / Details on Signboard -->
    <line x1="200" y1="255" x2="600" y2="255" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="400" y="280" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      📍 Main Sarafa Bazar, Morena (M.P.) • Ph: +91 98XXX XXXXX
    </text>
  </g>

  <!-- Pari Publicity Tag -->
  <rect x="620" y="60" width="120" height="20" rx="3" fill="#FF6B00"/>
  <text x="680" y="74" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="9" font-weight="800" text-anchor="middle">3D ACRYLIC BOARD</text>
</svg>
