<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="flexBannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="50%" stop-color="#134074"/>
      <stop offset="100%" stop-color="#0A1128"/>
    </linearGradient>
    <linearGradient id="saffronGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="12" fill="url(#bgGrad)"/>

  <!-- Metal Iron Truss Scaffold Framework -->
  <rect x="70" y="50" width="660" height="420" rx="6" fill="none" stroke="#475569" stroke-width="12"/>
  <rect x="76" y="56" width="648" height="408" rx="4" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Star Flex Banner Canvas (Mounted with tension) -->
  <g filter="url(#shadow)">
    <rect x="105" y="85" width="590" height="350" rx="6" fill="url(#flexBannerGrad)" stroke="#1E293B" stroke-width="2"/>

    <!-- Glossy reflection streak on Star Flex -->
    <path d="M105 85 L280 85 L180 435 L105 435 Z" fill="#FFFFFF" fill-opacity="0.04"/>
    <path d="M350 85 L520 85 L420 435 L250 435 Z" fill="#FFFFFF" fill-opacity="0.03"/>

    <!-- Indian Geometric Accent Ring & Patterns -->
    <circle cx="610" cy="260" r="110" stroke="#FFA800" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.25"/>
    <circle cx="610" cy="260" r="80" stroke="#FFA800" stroke-width="1" opacity="0.2"/>

    <!-- School Banner Design Content -->
    <rect x="135" y="115" width="170" height="28" rx="4" fill="url(#saffronGold)"/>
    <text x="220" y="134" fill="#0A1128" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">★ ADMISSIONS OPEN 2026-27</text>

    <text x="135" y="195" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      CHAMBAL VALLEY
    </text>
    <text x="135" y="235" fill="#FBBF24" font-family="'Outfit', sans-serif" font-size="28" font-weight="800">
      PUBLIC SCHOOL, MORENA
    </text>

    <!-- Subtitle / Facilities -->
    <text x="135" y="275" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">
      CBSE Affiliated • Nursery to Class XII • Smart Digital Classes
    </text>

    <!-- Bullet Highlights -->
    <rect x="135" y="295" width="410" height="42" rx="6" fill="#071326" fill-opacity="0.6" stroke="#1E40AF" stroke-width="1"/>
    <text x="150" y="321" fill="#93C5FD" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">
      ✓ AC Classrooms  |  ✓ Safe Bus Facility Across Morena  |  ✓ STEM Labs
    </text>

    <!-- Contact & Register Line -->
    <text x="135" y="375" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">
      📍 AB Road Campus, Morena (M.P.)
    </text>
    <rect x="135" y="390" width="180" height="30" rx="4" fill="#10B981"/>
    <text x="225" y="410" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" text-anchor="middle">CALL: +91 98XXX XXXXX</text>

    <text x="560" y="415" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500">
      Printed by Pari Publicity • Morena
    </text>
  </g>

  <!-- Brass Eyelets / Grommets and Elastic Ties to the frame -->
  <!-- Top Grommets -->
  <circle cx="120" cy="98" r="5" fill="#94A3B8" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="98" x2="100" y2="60" stroke="#000" stroke-width="2"/>

  <circle cx="280" cy="98" r="5" fill="#94A3B8" stroke="#334155" stroke-width="2"/>
  <line x1="280" y1="98" x2="280" y2="60" stroke="#000" stroke-width="2"/>

  <circle cx="480" cy="98" r="5" fill="#94A3B8" stroke="#334155" stroke-width="2"/>
  <line x1="480" y1="98" x2="480" y2="60" stroke="#000" stroke-width="2"/>

  <circle cx="680" cy="98" r="5" fill="#94A3B8" stroke="#334155" stroke-width="2"/>
  <line x1="680" y1="98" x2="700" y2="60" stroke="#000" stroke-width="2"/>

  <!-- Bottom Grommets -->
  <circle cx="120" cy="422" r="5" fill="#94A3B8" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="422" x2="100" y2="460" stroke="#000" stroke-width="2"/>

  <circle cx="280" cy="422" r="5" fill="#94A3B8" stroke="#334155" stroke-width="2"/>
  <line x1="280" y1="422" x2="280" y2="460" stroke="#000" stroke-width="2"/>

  <circle cx="480" cy="422" r="5" fill="#94A3B8" stroke="#334155" stroke-width="2"/>
  <line x1="480" y1="422" x2="480" y2="460" stroke="#000" stroke-width="2"/>

  <circle cx="680" cy="422" r="5" fill="#94A3B8" stroke="#334155" stroke-width="2"/>
  <line x1="680" y1="422" x2="700" y2="460" stroke="#000" stroke-width="2"/>

  <!-- Left & Right Grommets -->
  <circle cx="115" cy="260" r="5" fill="#94A3B8" stroke="#334155" stroke-width="2"/>
  <line x1="115" y1="260" x2="75" y2="260" stroke="#000" stroke-width="2"/>

  <circle cx="685" cy="260" r="5" fill="#94A3B8" stroke="#334155" stroke-width="2"/>
  <line x1="685" y1="260" x2="725" y2="260" stroke="#000" stroke-width="2"/>
</svg>
