<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="metalPillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FF7B1A"/>
    </linearGradient>
    <filter id="shadowHeavy" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="spotlightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Sky Background with clouds effect -->
  <rect width="800" height="520" rx="12" fill="url(#skyGrad)"/>
  <circle cx="700" cy="80" r="140" fill="#FFFFFF" fill-opacity="0.08" filter="blur(30px)"/>
  <circle cx="100" cy="180" r="180" fill="#60A5FA" fill-opacity="0.2" filter="blur(40px)"/>

  <!-- Steel Pillars and Heavy Truss Support (Highway Billboard Structure) -->
  <rect x="230" y="310" width="30" height="210" fill="url(#metalPillar)"/>
  <rect x="540" y="310" width="30" height="210" fill="url(#metalPillar)"/>
  
  <!-- Iron Cross Bracing -->
  <line x1="230" y1="320" x2="570" y2="460" stroke="#334155" stroke-width="6"/>
  <line x1="230" y1="460" x2="570" y2="320" stroke="#334155" stroke-width="6"/>
  <line x1="230" y1="390" x2="570" y2="390" stroke="#475569" stroke-width="5"/>
  <line x1="230" y1="480" x2="570" y2="480" stroke="#475569" stroke-width="5"/>

  <!-- Hoarding Billboard Frame & Drop Shadow -->
  <g filter="url(#shadowHeavy)">
    <!-- Outer Metal Bezel Frame -->
    <rect x="70" y="50" width="660" height="270" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="4"/>
    <!-- Inner Print Canvas Board -->
    <rect x="82" y="62" width="636" height="246" rx="4" fill="url(#boardGrad)"/>

    <!-- Jaali Pattern Accent on Board -->
    <g opacity="0.08" stroke="#F59E0B" stroke-width="1.5" fill="none">
      <circle cx="630" cy="185" r="90"/>
      <circle cx="630" cy="185" r="70"/>
      <circle cx="630" cy="185" r="50"/>
      <polygon points="630,95 720,185 630,275 540,185"/>
      <polygon points="630,115 700,185 630,255 560,185"/>
    </g>

    <!-- Content on Billboard (Realistic Morena Prime Hoarding Ad) -->
    <rect x="110" y="85" width="160" height="26" rx="13" fill="url(#goldAcc)"/>
    <text x="190" y="103" fill="#0A192F" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">MORENA HIGHWAY PRIME MEDIA</text>

    <text x="110" y="160" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      BIG IMPACT. <tspan fill="#FF7B1A">MAXIMUM REACH.</tspan>
    </text>

    <text x="110" y="196" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600">
      Chambal Expressway &amp; AB Road Prime Hoarding Locations
    </text>

    <text x="110" y="235" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">
      High-visibility Uni-poles &amp; Roof-top displays managed exclusively by Pari Publicity.
    </text>

    <!-- Pari Publicity Badge on Corner -->
    <rect x="110" y="260" width="220" height="32" rx="6" fill="#1E3A8A" fill-opacity="0.8" stroke="#3B82F6" stroke-width="1"/>
    <text x="120" y="281" fill="#FEF08A" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">★ EXCLUSIVE HOARDING NETWORK</text>
    <text x="340" y="282" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">📞 Book: Morena Center</text>
  </g>

  <!-- Top Spotlights (Illumination Fixtures) -->
  <!-- Fixture 1 -->
  <rect x="170" y="24" width="36" height="14" rx="2" fill="#334155" stroke="#64748B"/>
  <polygon points="188,38 180,50 196,50" fill="#475569"/>
  <circle cx="188" cy="40" r="7" fill="#FDE047" opacity="0.9" filter="url(#spotlightGlow)"/>
  <polygon points="175,44 120,160 250,160" fill="#FEF08A" opacity="0.1"/>

  <!-- Fixture 2 -->
  <rect x="382" y="24" width="36" height="14" rx="2" fill="#334155" stroke="#64748B"/>
  <polygon points="400,38 392,50 408,50" fill="#475569"/>
  <circle cx="400" cy="40" r="7" fill="#FDE047" opacity="0.9" filter="url(#spotlightGlow)"/>
  <polygon points="387,44 320,160 480,160" fill="#FEF08A" opacity="0.1"/>

  <!-- Fixture 3 -->
  <rect x="594" y="24" width="36" height="14" rx="2" fill="#334155" stroke="#64748B"/>
  <polygon points="612,38 604,50 620,50" fill="#475569"/>
  <circle cx="612" cy="40" r="7" fill="#FDE047" opacity="0.9" filter="url(#spotlightGlow)"/>
  <polygon points="599,44 540,160 670,160" fill="#FEF08A" opacity="0.1"/>

  <!-- Catwalk Grating in Front -->
  <rect x="60" y="318" width="680" height="12" rx="2" fill="#334155"/>
  <line x1="70" y1="324" x2="730" y2="324" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
