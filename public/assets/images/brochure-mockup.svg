<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBrochure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <linearGradient id="goldPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="foldLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="foldMiddle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="foldRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1E3D"/>
      <stop offset="100%" stop-color="#162E56"/>
    </linearGradient>
    <filter id="brochureShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="12" fill="url(#bgBrochure)"/>

  <!-- Tri-fold Brochure 3D Spread -->
  <g filter="url(#brochureShadow)">
    <!-- Panel 1: Left Flap (Inside Cover) -->
    <path d="M 120 100 L 310 80 L 310 440 L 120 420 Z" fill="url(#foldLeft)" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Shadow along fold crease -->
    <path d="M 300 81 L 310 80 L 310 440 L 300 439 Z" fill="#000000" fill-opacity="0.15"/>

    <!-- Left Panel Content -->
    <rect x="145" y="125" width="130" height="16" rx="3" fill="#0B1E3D"/>
    <text x="210" y="137" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="9" font-weight="700" text-anchor="middle">AMENITIES &amp; HIGHLIGHTS</text>

    <line x1="145" y1="165" x2="285" y2="165" stroke="#CBD5E1" stroke-width="1"/>
    <text x="145" y="185" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">✓ 40-Ft Wide CC Roads</text>
    <text x="145" y="205" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">✓ 24x7 Security &amp; CCTV</text>
    <text x="145" y="225" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">✓ Grand Clubhouse</text>
    <text x="145" y="245" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">✓ Landscaped Green Parks</text>
    <text x="145" y="265" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">✓ 100% Legal RERA Approved</text>

    <!-- Mini architectural layout diagram -->
    <rect x="145" y="295" width="140" height="95" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="3 3"/>
    <rect x="155" y="305" width="55" height="35" fill="#CBD5E1"/>
    <rect x="220" y="305" width="55" height="35" fill="#CBD5E1"/>
    <rect x="155" y="348" width="120" height="32" fill="#E2E8F0"/>
    <text x="215" y="367" fill="#475569" font-family="'Outfit', sans-serif" font-size="8" font-weight="700" text-anchor="middle">MASTER LAYOUT PLAN</text>

    <!-- Panel 2: Middle Flap (Center Spread) -->
    <path d="M 310 80 L 500 70 L 500 450 L 310 440 Z" fill="url(#foldMiddle)" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Fold Crease shadow -->
    <path d="M 490 71 L 500 70 L 500 450 L 490 449 Z" fill="#000000" fill-opacity="0.12"/>

    <!-- Middle Panel Content -->
    <rect x="330" y="105" width="145" height="20" rx="4" fill="#FF6B00"/>
    <text x="402" y="119" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="10" font-weight="800" text-anchor="middle">PROJECT SPECIFICATIONS</text>

    <text x="330" y="150" fill="#0B1E3D" font-family="'Outfit', sans-serif" font-size="14" font-weight="800">Prime Living in Morena</text>
    <text x="330" y="172" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500">
      Developed with state-of-the-art engineering. 1200 to 2400 sq.ft residential plots ready for registry.
    </text>

    <!-- Floor Plan Visual -->
    <rect x="330" y="195" width="145" height="120" rx="4" fill="#0B2545"/>
    <circle cx="402" cy="255" r="35" fill="#1E3A8A"/>
    <text x="402" y="252" fill="#FBBF24" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" text-anchor="middle">VILLA PLOTS</text>
    <text x="402" y="267" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" text-anchor="middle">Booking Starts ₹11,000</text>

    <rect x="330" y="330" width="145" height="35" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="340" y="346" fill="#92400E" font-family="'Outfit', sans-serif" font-size="9" font-weight="800">SPECIAL INAUGURAL OFFER</text>
    <text x="340" y="358" fill="#78350F" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600">Free Registry on First 21 Bookings!</text>

    <text x="330" y="415" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">Bank Loan Approved by SBI, HDFC</text>

    <!-- Panel 3: Right Cover (Front Title Page) -->
    <path d="M 500 70 L 680 90 L 680 430 L 500 450 Z" fill="url(#foldRight)" stroke="#3B82F6" stroke-width="1"/>

    <!-- Subtle Jaali on Cover -->
    <circle cx="590" cy="210" r="60" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
    <circle cx="590" cy="210" r="45" stroke="#F59E0B" stroke-width="0.8" opacity="0.3"/>

    <!-- Front Cover Content -->
    <rect x="520" y="115" width="130" height="22" rx="11" fill="url(#goldPanel)"/>
    <text x="585" y="130" fill="#0A192F" font-family="'Outfit', sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1">RERA APPROVED</text>

    <text x="520" y="195" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="24" font-weight="900">ROYAL</text>
    <text x="520" y="222" fill="#FBBF24" font-family="'Outfit', sans-serif" font-size="24" font-weight="900">PALMS</text>
    <text x="520" y="242" fill="#94A3B8" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" letter-spacing="2">RESIDENCY</text>

    <text x="520" y="275" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">
      Morena's Most Elite Township
    </text>

    <line x1="520" y1="295" x2="650" y2="295" stroke="#F59E0B" stroke-width="1.5"/>

    <text x="520" y="325" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500">📍 Station Road Extension,</text>
    <text x="520" y="340" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500">Morena, Madhya Pradesh</text>

    <rect x="520" y="365" width="135" height="26" rx="4" fill="#FF6B00"/>
    <text x="587" y="382" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="10" font-weight="800" text-anchor="middle">PREMIUM BROCHURE</text>

    <text x="520" y="415" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500">Printed by Pari Publicity</text>
  </g>
</svg>
