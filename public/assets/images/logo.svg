<svg width="260" height="60" viewBox="0 0 260 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
    <linearGradient id="crestRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0B1E3D"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark / Emblem -->
  <g transform="translate(6, 4)">
    <!-- Base geometric hexagon/shield -->
    <rect x="0" y="0" width="52" height="52" rx="12" fill="url(#crestRing)" stroke="#3B82F6" stroke-width="1.5"/>
    
    <!-- Dynamic Print / Sunburst Angle -->
    <path d="M 12 12 L 40 12 L 40 26 Q 40 38 26 38 L 22 38 L 22 44 L 12 44 Z" fill="url(#logoEmblemGrad)"/>
    <rect x="20" y="18" width="10" height="12" rx="3" fill="#0B1E3D"/>

    <!-- Small Sparkle / Star in top corner -->
    <circle cx="42" cy="10" r="3" fill="#FDE047"/>
  </g>

  <!-- Brand Typography -->
  <!-- Main English Brand Name -->
  <text x="70" y="32" fill="#0B1E3D" class="brand-text-dark" font-family="'Outfit', sans-serif" font-size="24" font-weight="900" letter-spacing="-0.5">
    Pari <tspan fill="#FF6B00">Publicity</tspan>
  </text>

  <!-- Hindi Subtext / Trust line -->
  <text x="71" y="48" fill="#64748B" class="brand-subtext" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">
    परी पब्लिसिटी • MORENA, M.P.
  </text>
</svg>
